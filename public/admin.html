<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahesh Marketing | Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><style>body{padding:30px}.admin{max-width:1150px;margin:auto}.admin-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.admin-grid{display:grid;grid-template-columns:360px 1fr;gap:25px}.panel{background:var(--paper);padding:25px}.panel h2{font-size:28px;margin-bottom:18px}.admin-list{display:grid;gap:10px}.admin-product,.order{border:1px solid var(--line);padding:14px}.admin-product{display:flex;gap:12px;align-items:center}.admin-product img{width:52px;height:52px;object-fit:cover}.admin-product div{flex:1}.admin-product b,.order b{display:block}.admin-product small,.order small{color:var(--muted)}.text-button{background:none;border:0;text-decoration:underline;color:var(--orange);cursor:pointer;padding:5px}.order{display:grid;grid-template-columns:1fr auto;gap:12px}.order p{font-size:13px;margin:6px 0;color:var(--muted)}.order select{padding:6px;border:1px solid var(--line);background:#fff}.hidden{display:none}@media(max-width:800px){body{padding:18px}.admin-grid{grid-template-columns:1fr}.admin-top{align-items:start;gap:12px;flex-direction:column}}</style></head><body><div class="admin"><div class="admin-top"><a class="brand" href="index.html"><span>MM</span><div>Mahesh Marketing<small>Store administration</small></div></a><button class="text-button" id="logout">Log out</button></div>
<section id="login" class="panel" style="max-width:430px;margin:80px auto"><p class="eyebrow">PRIVATE AREA</p><h2>Store admin</h2><form id="login-form"><label>Admin password<input type="password" id="token" required autocomplete="current-password"></label><button class="button full">Open dashboard</button><p class="form-message" id="login-message"></p></form></section>
<main id="dashboard" class="hidden"><div class="admin-grid"><section class="panel"><p class="eyebrow">PRODUCT MANAGER</p><h2 id="form-title">Add a product</h2><form id="product-form"><input type="hidden" name="id"><label>Product name<input name="name" required></label><label>Category<input name="category" required placeholder="e.g. Diaries"></label><label>Price (₹)<input name="price" type="number" min="0" required></label><label>Image URL<input name="image" type="url" placeholder="https://..."></label><label>Description<textarea name="description" rows="3"></textarea></label><label><input name="featured" type="checkbox" style="display:inline;width:auto;margin-right:7px">Show as featured</label><button class="button full">Save product</button><button type="button" class="text-button hidden" id="cancel-edit">Cancel editing</button><p class="form-message" id="product-message"></p></form></section><section><section class="panel"><p class="eyebrow">LIVE CATALOGUE</p><h2>Products</h2><div id="admin-products" class="admin-list"></div></section><section class="panel" style="margin-top:25px"><p class="eyebrow">CUSTOMER REQUESTS</p><h2>Orders</h2><div id="orders" class="admin-list"></div></section></section></div></main></div><script src="admin.js"></script></body></html>
